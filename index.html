<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- PyScript CSS -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <!-- This script tag bootstraps PyScript -->
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <title>Project Q1</title>
    <style>
        body {
            background-image:url(https://images.unsplash.com/photo-1671197346374-9d03a2a33a92?q=80&w=871&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D);
            background-size: cover;
            background-size: 150%, 100%;
            background-position: center;
            background-repeat: no-repeat;
            font-family: "Comic Sans MS", cursive; 
            color: #6d4b5a;
            text-align: center;
            margin: 0;
            padding: 0;
        }   

        ul {
            list-style-type: none;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #333333;
        }

        ul li {
            float: left;
        }

        ul li.right {
            float: right;
            display: block;
            color: white;
            text-align: center;
            padding: 14px 16px;
            text-decoration: none;
        }

        ul li a {
            display: block;
            color: white;
            text-align: center;
            padding: 14px 16px;
            text-decoration: none;
        }

        ul li a:hover {
            background-color: #111111;
        }

        .receiptdiv {
            text-align: center;
            box-shadow: 0px 8px 14px 1px #8e8080;
            border-radius: 15px;
            background: linear-gradient(0deg, #ffffff 0%, #eeeae7 100%);
            width: 500px;
            max-width: 90%;
            margin: 30px auto;
            padding: 20px;
        }

        input[type="submit"] {
            background: linear-gradient(135deg, #ffe5cc, #cfcbc2);
            color: #6d4b5a;
            font-family: "Comic Sans MS", cursive;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 20px;
            padding: 10px 25px;
            cursor: pointer;
            box-shadow: 0px 4px 8px #b89ca8;
            transition: 0.2s;
        }
    </style>
</head>
<body>
    <ul>
        <li><a href="index.html">Receipt Generator</a></li>
        <li><a href="index2.html">SKU Generator</a></li>
        <li class="right">Skewer || Andrea C. Zagala</li>
    </ul>
    <div class="receiptdiv">
        <h2>Coffee Shop Receipt</h2>
        <h4>Menu:</h4>
        <input type="checkbox" id="order1" value="99">
        <label for="order1-label">Americano - 99</label><br>
        <input type="checkbox" id="order2" value="129">
        <label for="order2-label">Spanish Latte - 129</label><br>
        <input type="checkbox" id="order3" value="175">
        <label for="order3-label">Strawberry Frappe - 175</label><br>
        <input type="checkbox" id="order4" value="149">
        <label for="order4-label">Affogato - 149</label><br>
        <input type="checkbox" id="order5" value="129">
        <label for="order5-label">Caramel Macchiato - 129</label><br><br>
        <input type="submit" py-click="menuorder" value="Create Order">

        <div id="receipt" style="display: none;">
            <h4>=== Receipt: ===</h4>
            <div id="result"></div>
        </div>
        <py-script src="main.py"></py-script>
    </div>
</body>
</html>
