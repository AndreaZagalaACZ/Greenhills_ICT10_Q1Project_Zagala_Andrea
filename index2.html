<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- PyScript CSS -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <!-- This script tag bootstraps PyScript -->
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <title>Project Q1</title>
    <style>
        body {
            background-image:url(https://images.unsplash.com/photo-1671197346374-9d03a2a33a92?q=80&w=871&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D);
            background-size: cover;
            background-size: 150%, 100%;
            background-position: center;
            background-repeat: no-repeat;
            font-family: "Comic Sans MS", cursive; 
            color: #6d4b5a;
            text-align: center;
            margin: 0;
            padding: 0;
        }   

        ul {
            list-style-type: none;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #333333;
        }

        ul li {
            float: left;
        }

        ul li.right {
            float: right;
            display: block;
            color: white;
            text-align: center;
            padding: 14px 16px;
            text-decoration: none;
        }

        ul li a {
            display: block;
            color: white;
            text-align: center;
            padding: 14px 16px;
            text-decoration: none;
        }

        ul li a:hover {
            background-color: #111111;
        }

        .receiptdiv {
            text-align: center;
            box-shadow: 0px 8px 14px 1px #8e8080;
            border-radius: 15px;
            background: linear-gradient(0deg, #ffffff 0%, #eeeae7 100%);
            width: 500px;
            max-width: 90%;
            margin: 30px auto;
            padding: 20px;
        }

        #results {
            display: none;
        }

        input[type="text"], select {
            font-family: "Comic Sans MS", cursive;
            font-size: 14px;
            color: #6d4b5a;
            background-color: #fff8fb;
            border: 2px solid #6d4b5a;
            border-radius: 10px;
            padding: 8px 12px;
            outline: none;
        }

        input[type="submit"] {
            background: linear-gradient(135deg, #ffe5cc, #cfcbc2);
            color: #6d4b5a;
            font-family: "Comic Sans MS", cursive;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 20px;
            padding: 10px 25px;
            cursor: pointer;
            box-shadow: 0px 4px 8px #b89ca8;
            transition: 0.2s;
        }
    </style>
</head>
<body>
    <ul>
        <li><a href="index.html">Receipt Generator</a></li>
        <li><a href="index2.html">SKU Generator</a></li>
        <li class="right">Skewer || Andrea C. Zagala</li>
    </ul>
    <div class="receiptdiv">
        <h2>SKU Generator</h2>
        <label>Category</label><br>
            <select id="category" placeholder="e.g.">
                <option>Sticker</option>
                <option>Accessories</option>
                <option>Plushie</option>
                <option>Keychain</option>
                <option>Stationery</option>
                <option>Bag</option>
                <option>Clothing</option>
                <option>Other</option> 
            </select><br><br>
        <label>Product Name</label><br>
        <input type="text" id="product_name" placeholder="e.g. Shoes"><br><br>
        <label>Stock Quantity</label><br>
        <input type="text" id="stock_quantity" placeholder="e.g. 10"><br><br>
        <input type="submit" py-click="skugeneration" value="Generate SKU"><br><br> 
        <div id="receipt" style="display: none;">
            <div id="result2"></div>
        </div>
        <py-script src="main2.py"></py-script>
    </div>
</body> 
</html>
